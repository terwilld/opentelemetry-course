server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

query_frontend:
  search:
    max_duration: 0s
ingester:
  max_block_duration: 5m

metrics_generator:
  storage:
    path: /var/tempo/metrics-storage
  processor:
    service_graphs: {}
    span_metrics:
      dimensions:
        - http.method
        - http.status_code
        - service.name

compactor:
  compaction:
    block_retention: 72h
